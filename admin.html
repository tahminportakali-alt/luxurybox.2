<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Paneli - LUXURY BOX</title>
    <link rel="stylesheet" href="css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div id="adminLoginPage" class="admin-login-page">
        <div class="admin-login-box">
            <div class="lock-icon"><i class="fas fa-user-shield"></i></div>
            <h2>Admin Paneli</h2>
            <p class="subtitle">LUXURY BOX yönetim paneline hoş geldiniz</p>
            <form id="adminLoginForm" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Kullanıcı Adı</label>
                    <input type="text" id="adminUsername" placeholder="Kullanıcı adınızı girin" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Şifre</label>
                    <input type="password" id="adminPassword" placeholder="Şifrenizi girin" required>
                </div>
                <div id="loginError" class="error"></div>
                <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> Giriş Yap</button>
            </form>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Siteye Dön</a>
        </div>
    </div>

    <!-- ===== ADMIN PANEL ===== -->
    <div id="adminPanelPage" style="display:none;">
        <div class="admin-panel-container">
            <div class="admin-panel-header">
                <h1><i class="fas fa-cog"></i> Admin Paneli</h1>
                <button class="logout-btn" onclick="handleAdminLogout()"><i class="fas fa-sign-out-alt"></i> Çıkış Yap</button>
            </div>

            <div class="admin-card">
                <h3><i class="fas fa-plus-circle"></i> Yeni Ürün Ekle</h3>
                <form id="addProductForm">
                    <div class="form-row">
                        <div class="form-group"><label>Ürün Adı</label><input type="text" id="adminProductIsim" placeholder="Örn: Loro Piana Summer Walk" required></div>
                        <div class="form-group"><label>Marka</label><input type="text" id="adminProductMarka" placeholder="Örn: Loro Piana"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Fiyat (TL)</label><input type="number" id="adminProductFiyat" placeholder="Örn: 14900" required></div>
                        <div class="form-group"><label>Resim URL</label><input type="text" id="adminProductResim" placeholder="css/foto/urun.jpg" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Kategori</label>
                            <select id="adminProductKategori" required style="width:100%; padding:12px 16px; background:#0a0a0a; border:1px solid rgba(255,255,255,0.1); border-radius:10px; color:#fff; font-size:14px;">
                                <option value="anasayfa">Ana Sayfa</option>
                                <option value="ayakkabilar">Ayakkabılar (kadin.html)</option>
                                <option value="gozluk-saat">Gözlük & Saat (erkek.html)</option>
                                <option value="cantalar">Çantalar (cocuk.html)</option>
                            </select>
                        </div>
                    </div>
                    <button type="button" class="btn-add-product" onclick="handleAddProduct(event)"><i class="fas fa-save"></i> Ürün Ekle</button>
                </form>
            </div>

            <div class="admin-card">
                <h3><i class="fas fa-list"></i> Mevcut Ürünler</h3>
                <div id="adminProductList" class="admin-product-grid"></div>
            </div>
        </div>
    </div>

    <!-- ===== SUPABASE BAĞLANTISI (Tek Başına) ===== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        // 1. SUPABASE AYARLARI (Buradaki anahtar doğru)
        const SUPABASE_URL = 'https://jjszczuxzmviluoqubloo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_aWvCMroovjTksIx4mk3owA_vqCFKvJl';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. FONKSİYONLAR (Direkt burada)
        async function getProducts() {
            const { data, error } = await supabaseClient.from('urunler').select('*').order('id', { ascending: false });
            if (error) { console.error('❌ Ürünler alınamadı:', error); return []; }
            return data;
        }

        async function addProduct(product) {
            const { data, error } = await supabaseClient.from('urunler').insert([{
                isim: product.isim,
                marka: product.marka || '',
                fiyat: product.fiyat,
                resim: product.resim,
                kategori: product.kategori
            }]).select();
            if (error) { console.error('❌ Ürün eklenemedi:', error); return null; }
            return data[0];
        }

        async function deleteProduct(id) {
            const { error } = await supabaseClient.from('urunler').delete().eq('id', id);
            if (error) { console.error('❌ Ürün silinemedi:', error); return false; }
            return true;
        }

        // 3. ADMIN İŞLEMLERİ
        const ADMIN_CREDENTIALS = { username: 'admin', password: '123456' };

        function handleAdminLogin(event) {
            event.preventDefault();
            const username = document.getElementById('adminUsername').value;
            const password = document.getElementById('adminPassword').value;
            const errorElement = document.getElementById('loginError');
            if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                errorElement.className = 'error success';
                errorElement.textContent = '✓ Giriş başarılı! Yönlendiriliyorsunuz...';
                setTimeout(() => {
                    document.getElementById('adminLoginPage').style.display = 'none';
                    document.getElementById('adminPanelPage').style.display = 'block';
                    loadAdminProducts();
                }, 600);
            } else {
                errorElement.className = 'error';
                errorElement.textContent = '❌ Hatalı kullanıcı adı veya şifre!';
            }
        }

        function handleAdminLogout() {
            if (confirm('Çıkış yapmak istediğinize emin misiniz?')) {
                window.location.href = 'index.html';
            }
        }

        async function handleAddProduct(event) {
            event.preventDefault();
            const isim = document.getElementById('adminProductIsim').value.trim();
            const marka = document.getElementById('adminProductMarka').value.trim();
            const fiyat = parseInt(document.getElementById('adminProductFiyat').value);
            const resim = document.getElementById('adminProductResim').value.trim();
            const kategori = document.getElementById('adminProductKategori').value;

            if (!isim || !fiyat || !resim) {
                alert('Lütfen tüm alanları doldurun!');
                return;
            }

            try {
                const newProduct = await addProduct({ isim, marka, fiyat, resim, kategori });
                if (newProduct) {
                    document.getElementById('adminProductIsim').value = '';
                    document.getElementById('adminProductMarka').value = '';
                    document.getElementById('adminProductFiyat').value = '';
                    document.getElementById('adminProductResim').value = '';
                    loadAdminProducts();
                    alert('✅ Ürün Supabase veritabanına başarıyla eklendi!');
                } else {
                    alert('❌ Ürün eklenirken bir hata oluştu! (Konsolu kontrol edin)');
                }
            } catch (error) {
                alert('❌ Hata: ' + error.message);
                console.error(error);
            }
        }

        async function loadAdminProducts() {
            const container = document.getElementById('adminProductList');
            if (!container) return;
            const products = await getProducts();
            if (products.length === 0) {
                container.innerHTML = '<div class="no-products">Henüz ürün eklenmemiş.</div>';
                return;
            }
            let html = '';
            products.forEach((product) => {
                let categoryName = 'Ana Sayfa';
                if (product.kategori === 'ayakkabilar') categoryName = 'Ayakkabılar';
                else if (product.kategori === 'gozluk-saat') categoryName = 'Gözlük & Saat';
                else if (product.kategori === 'cantalar') categoryName = 'Çantalar';
                html += `
                    <div class="admin-product-item">
                        <img src="${product.resim}" alt="${product.isim}" onerror="this.src='css/foto/placeholder.jpeg'" />
                        <div class="admin-product-info">
                            <h4>${product.isim}</h4>
                            ${product.marka ? `<p>${product.marka}</p>` : ''}
                            <p class="price">${product.fiyat.toLocaleString()} TL</p>
                            <p style="color:rgba(255,255,255,0.4); font-size:12px; margin-top:4px;">
                                <i class="fas fa-tag"></i> ${categoryName}
                            </p>
                        </div>
                        <button class="delete-product-btn" onclick="handleDeleteProduct('${product.id}')">
                            <i class="fas fa-trash"></i> Sil
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function handleDeleteProduct(id) {
            if (!confirm('Bu ürünü silmek istediğinize emin misiniz?')) return;
            const success = await deleteProduct(id);
            if (success) {
                loadAdminProducts();
                alert('✅ Ürün veritabanından silindi.');
            } else {
                alert('❌ Ürün silinirken bir hata oluştu!');
            }
        }
    </script>
</body>
</html>
